# Notifications — transient messages delivered to users
#
# Rules:
#   - INVITATION notifications require accept or decline to dismiss
#   - GENERAL notifications are dismissed by marking as read
#   - All notifications are deleted from the database upon dismissal

type Notification {
    _id: ID!
    recipient: String!      # Recipient user ID
    type: NotificationType!
    title: String!
    description: String!
    link: String            # Optional URL for navigation
    actionId: String        # Optional resource ID for invitation actions (org ID, scrimmage ID, etc.)
    senderName: String!     # Display name of sender, or "System"
    createdAt: Timestamp!
}

enum NotificationType {
    INVITATION
    GENERAL
}

input SendNotificationInput {
    recipient: String!
    type: NotificationType!
    title: String!
    description: String!
    link: String
    actionId: String
    senderName: String!
}

extend type Query {
    getNotifications(user_id: String!): [Notification!]!
}

extend type Mutation {
    sendNotification(input: SendNotificationInput!): Notification
    dismissNotification(notification_id: String!, user_id: String!): Boolean
}
