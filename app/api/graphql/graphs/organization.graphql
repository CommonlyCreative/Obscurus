# Organization schema
#
# Rules:
#   - A user can belong to at most ONE organization at a time
#   - An org can have any number of members but only 6 core players
#   - OrgRole.MANAGER has full control over the org (roster, invites, settings);
#     OrgRole.PLAYER does not. This is a permission level, independent of whether
#     the member actually plays — a manager can also be a player, or not
#     (see OrganizationMember.isPlayer).
#   - The org owner is always a MANAGER
#   - Core team slots (coreTeam) must be members with isPlayer: true; used as the default roster

type Organization {
    _id: ID!
    name: String!
    slug: String!                       # Lowercase, URL-safe, unique — used for search
    description: String
    logo: String
    owner: User!                        # Always OrgRole.MANAGER
    members: [OrganizationMember!]!     # All active + invited members
    coreTeam: [User!]!                  # Up to 6 designated starting players
    blocks: [AvailabilityBlock!]!
    artificial: Boolean!                # true = created outright by an admin (no real submitter);
                                         # false = created from an approved org request (a real user's org)
    disbanded: Boolean!                 # true = soft-disbanded; the org record is kept as a tombstone
    disbandedAt: Timestamp              # Set when disbanded
    region: String!                     # Region the org is based in (e.g. "NA", "EU", "ASIA"); set from the manage page
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

type AvailabilityBlock {
    day: Day!
    timesheets: [Timesheet!]
    exception: AvailabilityException
}

type AvailabilityException {
    date: Timestamp!
    timesheet: [Timesheet!]!
}

enum Day {
    MONDAY
    TUESDAY
    WEDNESDAY
    THURSDAY
    FRIDAY
    SATURDAY
    SUNDAY
}

type Timesheet {
    startTime: Timestamp!
    endTime: Timestamp!
}

# Junction type between a user and an organization
type OrganizationMember {
    user: User!
    orgRole: OrgRole!
    isPlayer: Boolean!   # Eligible for the core team roster — independent of orgRole
    status: OrgMemberStatus!
    joinedAt: Timestamp!
}

# Organization-level roles (distinct from platform Role in profile.graphql)
enum OrgRole {
    MANAGER     # Schedules scrimmages, manages roster, assigns subs, invites members
    PLAYER      # No management permissions
}

enum OrgMemberStatus {
    ACTIVE
    INACTIVE
    INVITED     # Pending acceptance of org membership invitation
}

input CreateOrganizationInput {
    name: String!
    slug: String!
    description: String
    logo: String
    artificial: Boolean          # Admin-only; omit/false for real orgs — see Organization.artificial
}

# A manager-created placeholder player — not yet signed up.
# If a real user later signs in with Discord using this exact email, Better Auth's
# implicit account linking adopts this same user document instead of creating a new one.
# email is optional: if omitted, a fake, unclaimable placeholder address is generated
# server-side (see UserDataSource.createManualUser) — an admin can set the real email
# in later, once known, letting Discord sign-in claim the profile.
input CreatePlaceholderPlayerInput {
    name: String!
    email: String
}

input UpdateOrganizationInput {
    name: String
    description: String
    logo: String
    region: String
}

input AvailabilityBlockInput {
    day: Day!
    timesheets: [TimesheetInput!]
}

input TimesheetInput {
    startTime: Timestamp!
    endTime: Timestamp!
}

input ExceptionInput {
    day: Day
    date: Timestamp!
    timesheets: [TimesheetInput!]!
}

extend type Query {
    getUserOrgInvitations(user_id: String!): [Organization]!
    searchOrganizations(query: String!, limit: Int): [Organization!]!
    getOrganization(org_id: String!): Organization
    getOrganizations: [Organization!]
    getOrganizationBySlug(slug: String!): Organization
    getOrganizationMembers(org_id: String!): [OrganizationMember!]!
}

extend type Mutation {
    # Org lifecycle (only users with platform Role.MEMBER+ can create an org)
    createOrganization(owner_id: String!, input: CreateOrganizationInput!): Organization
    updateOrganization(org_id: String!, input: UpdateOrganizationInput!): Organization
    # Soft-disband: flags the org (kept as a tombstone), frees its members to join other
    # orgs, and clears the owner's approved org request so they may request a new org.
    disbandOrganization(org_id: String!): Boolean
    transferOwnership(org_id: String!, new_owner_id: String!): Organization

    # Admin-only: merges an admin-created artificial organization into the real one a
    # user later made for the same team. Only every scrimmage fake_org_id hosted or
    # played in is repointed to real_org_id (hostOrg/opponentOrg) — team rosters on
    # those scrimmages are untouched, since the placeholder players on them get folded
    # into their real profiles separately via mergeUsers. Neither organization record
    # nor fake_org_id's roster is deleted or modified; the artificial org is left in
    # place, still browsable/disbandable from the admin panel.
    mergeOrganizations(real_org_id: String!, fake_org_id: String!): Organization

    # Membership — manager-only operations
    inviteMember(org_id: String!, user_id: String!, orgRole: OrgRole!): OrganizationMember
    createPlaceholderPlayer(org_id: String!, orgRole: OrgRole!, input: CreatePlaceholderPlayerInput!): OrganizationMember
    acceptOrgInvite(org_id: String!, user_id: String!): OrganizationMember
    declineOrgInvite(org_id: String!, user_id: String!): Boolean
    removeMember(org_id: String!, user_id: String!): Boolean
    updateMemberRole(org_id: String!, user_id: String!, orgRole: OrgRole!): OrganizationMember
    updateMemberIsPlayer(org_id: String!, user_id: String!, isPlayer: Boolean!): OrganizationMember

    # Core team — manager-only; max 6 slots; must be active PLAYER members of this org
    setCoreTeam(org_id: String!, user_ids: [String!]!): Organization
    addCorePlayer(org_id: String!, user_id: String!): Organization
    removeCorePlayer(org_id: String!, user_id: String!): Organization
    
    updateAvailabilityBlocks(org_id: String!, blocks: [AvailabilityBlockInput!]!): Organization
    addAvailabilityBlock(org_id: String!, block: AvailabilityBlockInput!): Organization
    addException(org_id: String!, excpetion: ExceptionInput!): Organization
}
