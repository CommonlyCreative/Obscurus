# Scrimmage schema
#
# Lifecycle:
#   Public, ASAP (non-scheduled):
#     OPEN → (joinScrimmage, any team) → READY → (both readyUp) → ACTIVE → COMPLETED | CANCELLED
#
#   Public, scheduled (scheduledAt set): only organizations may join, not ad-hoc live
#   teams — joinScrimmage requires org_id and omits team, reserving the slot; the
#   joining org finalizes its roster afterward via setOpponentRoster, same as the
#   private/scheduled path below.
#     OPEN → (joinScrimmage, org_id, no team) → SCHEDULING → (setOpponentRoster) → SCHEDULED
#                → (both readyUp) → ACTIVE → COMPLETED | CANCELLED
#
#   Private (non-scheduled):
#     PENDING → (acceptScrimmageChallenge) → READY → (both readyUp) → ACTIVE → COMPLETED | CANCELLED
#     PENDING → (declineScrimmageChallenge) → CANCELLED
#
#   Private, scheduled:
#     PENDING → (acceptScrimmageChallenge) → SCHEDULING → (setOpponentRoster confirms) → SCHEDULED
#                → (both readyUp) → ACTIVE → COMPLETED | CANCELLED
#
# Match flow (within ACTIVE):
#   Host must set partyCode (setPartyCode) before starting the first match.
#   Scheduled scrimmages may defer the party code until game day.
#   Host calls startMatch → a new Match is appended (startedAt set, no result yet).
#   After the in-game match ends, host calls submitMatchResult with the Deadlock match_id + result.
#   The system tallies wins; if a series victor is determined → status COMPLETED, result set.
#   If the series is not decided and bestOf allows, the host may startMatch again.
#   Either leader can call endScrimmage at any point to end early (→ CANCELLED).
#
# Wager flow:
#   Both team leaders must each have >= wagerAmount credits when match becomes ACTIVE.
#   Credits are locked via placeWager (wager.graphql). On COMPLETED the winning
#   leader receives wagerAmount × 2. On CANCELLED both leaders are refunded.

type Scrimmage {
    _id: ID!
    host: User!                              # The user who posted the scrimmage
    hostOrg: Organization                    # Org the host represents; null = unaffiliated
    hostTeam: Team!                          # Host's 6-player lineup
    opponentOrg: Organization                # Opposing org; null until opponent joins/accepts
    opponentTeam: Team                       # Opponent lineup; null until they set roster
    note: String                             # Host's message ("6v6, no smurf pls")
    status: ScrimmageStatus!
    result: ScrimmageResult                  # Overall series result; set when COMPLETED
    bestOf: BestOf!
    region: String!
    isPrivate: Boolean!                      # true = directed at targetOrg only
    scheduledAt: Timestamp                   # Unix ms; null = ASAP
    wagerAmount: Int!                        # Credits each leader puts up (0 = no wager)
    partyCode: String                        # Party code players use to join the host lobby
    readyHost: Boolean!                      # Host leader has confirmed ready
    readyOpponent: Boolean!                  # Opponent leader has confirmed ready
    matches: [Match!]!                       # All matches in this series, in order
    invitations: [ScrimmageInvitation!]!     # Per-player RSVPs for scheduled matches
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

# A single game within a scrimmage series
type Match {
    number: Int!             # Series index starting at 1 (Match 1, Match 2, …)
    match_id: String         # Deadlock in-game match ID; submitted by host after the game ends
    result: MatchResult      # Null while the game is in progress
    startedAt: Timestamp!          # Unix ms when the host called startMatch
    concludedAt: Timestamp         # Unix ms when the host submitted the result
    draftLink: String              # Statlocker draft lobby for this specific match
    draftData: String              # Raw JSON draft export (picks/bans) uploaded by a leader — see uploadMatchDraft
}

enum BestOf {
    ONE,
    THREE,
    FIVE,
    UNLIMITED,
}

# A 6-player side in a scrimmage
type Team {
    name: String
    leader: User!
    members: [User!]!   # All 6 players including the leader
}

# Tracks each player's RSVP for a scheduled scrimmage.
# Created for every member of both teams when scheduledAt is set.
# Substitutes can be users outside the org (flexibility for managers).
type ScrimmageInvitation {
    scrimmage: Scrimmage!
    organization: Organization
    type: InvitationType!
    user: User!
    side: MatchSide!                # Which team this invitation is for
    status: InvitationStatus!
    substitute: User                # Manager-assigned replacement if this player declines
    respondedAt: Timestamp
    createdAt: Timestamp!
}

enum InvitationType {
    LEADER_INVITE
    PLAYER_INVITE
}

# "Looking for Substitute" posting for a scheduled scrimmage.
# Posted by a manager when a roster slot opens up.
# Visible on the LFS page; any user (including non-org) can apply.
type SubstituteRequest {
    _id: ID!
    scrimmage: Scrimmage!
    organization: Organization!
    replacing: User!
    postedBy: User!                 # Manager posting the request
    side: MatchSide!                # Which team needs the sub
    note: String                    # Requirements (e.g. "need flex player, Archon+")
    status: SubRequestStatus!
    applicants: [SubApplicant!]!
    filledBy: User                  # The applicant selected by the manager
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

# A user applying to fill a SubstituteRequest
type SubApplicant {
    _id: ID!
    request: SubstituteRequest!
    user: User!
    message: String
    status: ApplicantStatus!
    appliedAt: Timestamp!
}

enum ScrimmageStatus {
    OPEN        # Public; waiting for any opponent to join
    PENDING     # Private; waiting for targetOrg to accept or decline
    READY       # Both teams confirmed; waiting for both leaders to ready up
    SCHEDULING  # Scheduled match accepted; both teams finalizing rosters
    SCHEDULED   # Scheduled; rosters confirmed, waiting for game day
    ACTIVE      # Live; matches are being played
    COMPLETED   # Series finished with a confirmed result
    CANCELLED
}

# Overall series result — set on the Scrimmage when status → COMPLETED
enum ScrimmageResult {
    HOST_WIN
    OPPONENT_WIN
    DRAW        # All matches played, equal wins on both sides
    CANCELLED
}

# Per-match result — set on a Match after the game concludes
enum MatchResult {
    HOST_WIN
    OPPONENT_WIN
    DRAW
    INCONCLUSIVE
    CANCELLED
}

enum InvitationStatus {
    PENDING
    ACCEPTED
    DECLINED
}

enum MatchSide {
    HOST
    OPPONENT
}

enum SubRequestStatus {
    OPEN
    FILLED
    CANCELLED
}

enum ApplicantStatus {
    PENDING     # Awaiting manager review
    SELECTED    # Chosen as the substitute
    REJECTED
}

# Admin-only: directly schedules a real org (host) against an artificial
# (admin-created) org (opponent), skipping the invite/accept flow entirely since
# there's no real person on the artificial side to accept a challenge. The
# opponent's 6-player roster is auto-derived server-side from that org's core
# team / active roster. Rule: the host must be a real org and the opponent must
# be an artificial org — never the other way around.
input CreateArtificialScrimmageInput {
    hostOrg_id: String!
    host_id: String!             # Real user leading the host team; must be an active member of hostOrg
    hostTeam: [String!]!         # Exactly 6 user IDs
    opponentTeam: [String!]!         # Exactly 6 user IDs
    opponentOrg_id: String!      # Must be an artificial organization
    scheduledAt: Timestamp!
    bestOf: BestOf
    note: String
}

input CreateScrimmageInput {
    hostOrg_id: String
    team: [String!]!             # Host roster: exactly 6 user IDs
    teamName: String
    note: String
    host_id: String!
    leader_id: String            # Captain who runs the match — defaults to host_id if omitted; need not be on the roster
    isPrivate: Boolean!
    opponentOrg_id: String         # Required when isPrivate = true
    scheduledAt: Timestamp             # Omit for ASAP scrimmages
    wagerAmount: Int             # Credits; 0 or omit = no wager
    bestOf: BestOf               # Defaults to ONE
    partyCode: String            # May be provided upfront for ASAP scrimmages
    invitations: [ScrimmageInvitationInput!]
}

input ScrimmageInvitationInput {
    user_id: String!
    side: MatchSide!
    type: InvitationType!
    organization_id: String
}

input UpdateScrimmageInput {
    note: String
    scheduledAt: Timestamp
    wagerAmount: Int
}

# Used by the opponent manager to submit their 6-player roster after accepting a scheduled match
input SetOpponentRosterInput {
    scrimmage_id: String!
    leader_id: String!
    name: String
    team: [String!]!             # Exactly 6 user IDs
}

# Manager swaps one unavailable player for another in-place.
# Both remove_id and replace_id are required — you cannot leave a slot empty.
input UpdateRosterSlotInput {
    scrimmage_id: String!
    side: MatchSide!
    remove_id: String!
    replace_id: String!
}

input RespondToInvitationInput {
    scrimmage_id: String!
    user_id: String!
    status: InvitationStatus!   # ACCEPTED or DECLINED only
}

# A 6-player side in a scrimmage
input TeamInput {
    name: String
    leader: String!
    members: [String!]!   # All 6 players including the leader
}

input SubstituteRequestInput {
    scrimmage_id: String!
    org_id: String!
    side: MatchSide!
    note: String
}

extend type Query {
    getScrimmages(status: ScrimmageStatus, limit: Int): [Scrimmage!]!
    getScrimmage(scrimmage_id: String!): Scrimmage
    getPublicScrimmages(limit: Int): [Scrimmage!]!
    getOrgScrimmages(org_id: String!): [Scrimmage!]
    getUserScrimmages(user_id: String!): [Scrimmage!]!
    getScrimmageInvitations(user_id: String!): [ScrimmageInvitation!]!

    # LFS page queries
    getSubstituteRequests(status: SubRequestStatus, limit: Int): [SubstituteRequest!]!
    getSubstituteRequest(request_id: String!): SubstituteRequest
    getOrgSubstituteRequests(org_id: String!): [SubstituteRequest!]!
}


extend type Mutation {
    createScrimmage(input: CreateScrimmageInput!): Scrimmage
    createArtificialScrimmage(input: CreateArtificialScrimmageInput!): Scrimmage
    updateScrimmage(scrimmage_id: String!, input: UpdateScrimmageInput!): Scrimmage
    cancelScrimmage(scrimmage_id: String!): Scrimmage

    # Public scrimmage: opponent joins or leaves before a match starts. ASAP scrims
    # (no scheduledAt) accept any 6-player team, org-affiliated or ad-hoc — org_id is
    # optional there. Scheduled scrims (scheduledAt set) require org_id and no team —
    # only organizations may claim a scheduled slot, and the roster is finalized
    # afterward via setOpponentRoster, not at join time.
    joinScrimmage(scrimmage_id: String!, org_id: String, team: [String!]): Scrimmage
    leaveScrimmage(scrimmage_id: String!): Scrimmage

    # Private scrimmage: only leaders can accept challenge
    acceptScrimmageChallenge(scrimmage_id: String!, user_id: String!): Scrimmage
    declineScrimmageChallenge(scrimmage_id: String!, user_id: String!): Scrimmage

    # Scheduled scrimmage: opponent sets their roster (during SCHEDULING phase)
    setOpponentRoster(input: SetOpponentRosterInput!): Scrimmage

    # In-place roster swap — manager removes unavailable player and fills the slot immediately
    updateRosterSlot(input: UpdateRosterSlotInput!): Scrimmage

    # Player RSVP for scheduled scrimmages | ONLY FOR SCHEDULED SCRIMS
    respondToInvitation(input: RespondToInvitationInput!): ScrimmageInvitation

    # Manager assigns a substitute for a user who declined
    assignSubstitute(invitation_id: String!, substitute_id: String!): ScrimmageInvitation

    # Ready up — both leaders must call this to consent before ACTIVE begins
    readyUp(scrimmage_id: String!, side: MatchSide!): Scrimmage
    unready(scrimmage_id: String!, side: MatchSide!): Scrimmage

    # Party code — host sets this; required before startMatch can be called
    setPartyCode(scrimmage_id: String!, partyCode: String!): Scrimmage

    # Creates a Statlocker draft lobby for a specific match — each match in the series
    # gets its own draft. Nothing creates this automatically; a leader must press
    # "Create Draft Lobby" (or call this) when they want one. A no-op if the match
    # already has a draftLink (never overwrites an existing lobby, including one set
    # manually via setMatchDraftLink).
    createMatchDraft(scrimmage_id: String!, match_number: Int!): Scrimmage

    # Manually records a draft lobby link for a match — for when a leader already
    # created the lobby themselves (e.g. directly on Statlocker) instead of using
    # createMatchDraft. Overwrites any existing link for that match.
    setMatchDraftLink(scrimmage_id: String!, match_number: Int!, draftLink: String!): Scrimmage

    # Statlocker doesn't reliably call back with draft results, so a leader manually
    # uploads that match's draft JSON export instead. Stored as-is for the record;
    # overwrites any previous upload for that match.
    uploadMatchDraft(scrimmage_id: String!, match_number: Int!, draftData: String!): Scrimmage

    # Match lifecycle — host only
    startMatch(scrimmage_id: String!): Scrimmage
    cancelMatch(scrimmage_id: String!): Scrimmage
    submitMatchResult(scrimmage_id: String!, match_number: Int!, deadlock_match_id: String!, result: MatchResult!): Scrimmage

    # Re-attempts a match whose result is INCONCLUSIVE (the Deadlock API had no data for
    # it when it was first submitted). Refetches the match metadata; if it's available
    # now, determines the real victor/loser and re-runs the series tally. A no-op if the
    # match isn't INCONCLUSIVE or the metadata still isn't ready — cheap to call freely.
    reconcileMatchResult(scrimmage_id: String!, match_number: Int!): Scrimmage

    # End the scrimmage early — available to either leader when no match is in progress
    endScrimmage(scrimmage_id: String!): Scrimmage

    # LFS mutations
    createSubstituteRequest(input: SubstituteRequestInput!): SubstituteRequest
    cancelSubstituteRequest(request_id: String!): SubstituteRequest
    applyToSubstituteRequest(request_id: String!, message: String): SubApplicant
    selectSubstitute(request_id: String!, user_id: String!): SubstituteRequest
}
